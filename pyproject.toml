[project]
name = "godot-mcp"
version = "1.0.0"
description = "MCP server that lets Claude (or any MCP client) play a Godot 4 game"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/evangelato/godot-mcp"

[project.scripts]
godot-mcp = "godot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["godot_mcp"]
